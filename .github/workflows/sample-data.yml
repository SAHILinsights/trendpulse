name: Load SAMPLE demo data

# Manual only. Fills the warehouse with clearly labelled SAMPLE data from TrendPulse's offline
# API simulator (no YouTube API call, no API key, no quota) so every dashboard module can be
# demonstrated while live ingestion waits for compliance approval. Every run is stored with
# data_source = 'sample_fixture' and the dashboard shows a SAMPLE DATA banner.
on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Simulated 30-minute cycles to backfill (1-96; 48 = last 24 hours)"
        required: true
        default: "48"
      chaos:
        description: "Inject faults (corrupt metrics, schema break, regional outage, flaky requests)"
        type: boolean
        default: true
      confirm:
        description: "Type SAMPLE to confirm writing sample data into the warehouse"
        required: true
        default: ""

permissions:
  contents: read

# Shares the ingestion group so it never overlaps a real pipeline execution.
concurrency:
  group: trendpulse-ingestion
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRENDPULSE_LOG_FORMAT: json
      TRENDPULSE__INGESTION__MIN_SECONDS_BETWEEN_REQUESTS: "0"
      TRENDPULSE__INGESTION__BACKOFF_BASE_SECONDS: "0.01"
    steps:
      - name: Validate inputs
        env:
          CYCLES: ${{ inputs.cycles }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # inputs arrive via env (never interpolated into the script) and are strictly validated
          if [ "$CONFIRM" != "SAMPLE" ]; then echo "::error::type SAMPLE in the confirm box"; exit 1; fi
          if ! [[ "$CYCLES" =~ ^[0-9]{1,2}$ ]] || [ "$CYCLES" -lt 1 ] || [ "$CYCLES" -gt 96 ]; then
            echo "::error::cycles must be 1-96"; exit 1
          fi
          [ -n "$DATABASE_URL" ] || { echo "::error::DATABASE_URL secret missing"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Backfill SAMPLE cycles
        env:
          CYCLES: ${{ inputs.cycles }}
          CHAOS: ${{ inputs.chaos }}
        run: |
          ARGS="--cycles $CYCLES --interval 30 --allow-sample-on-postgres"
          if [ "$CHAOS" = "true" ]; then ARGS="$ARGS --chaos"; fi
          trendpulse simulate $ARGS
      - name: Platform status
        if: always()
        run: trendpulse status
