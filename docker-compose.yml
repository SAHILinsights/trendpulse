# Local full stack: PostgreSQL + pipeline + dashboard.
#   docker compose up -d db dashboard
#   docker compose run --rm pipeline trendpulse simulate --cycles 96 --allow-sample-on-postgres   # offline demo
#   YOUTUBE_API_KEY=... docker compose run --rm pipeline trendpulse run                          # real data
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trendpulse
      POSTGRES_PASSWORD: trendpulse-local-only
      POSTGRES_DB: trendpulse
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendpulse"]
      interval: 5s
      retries: 10
  pipeline:
    build: .
    command: ["trendpulse", "run"]
    environment:
      DATABASE_URL: postgresql://trendpulse:trendpulse-local-only@db:5432/trendpulse
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      db: {condition: service_healthy}
    profiles: ["pipeline"]
  dashboard:
    build: .
    environment:
      DASHBOARD_DATABASE_URL: postgresql://trendpulse:trendpulse-local-only@db:5432/trendpulse
    ports: ["8501:8501"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
