# TrendPulse topic taxonomy.
#
# Two levels: category -> topic. Each topic has keyword phrases matched on
# word boundaries against normalised text. Field weights (title > tags >
# description/channel) live in the classifier. `youtube_categories` adds a
# small prior when the video's YouTube categoryId matches.
#
# Topic IDs are derived from `id` and are STABLE: renaming `name` never
# changes the ID, so history is preserved. Never reuse an id for a
# different concept — retire it with `active: false` instead.
#
# YouTube category ids: 1 Film & Animation, 2 Autos, 10 Music, 15 Pets,
# 17 Sports, 19 Travel, 20 Gaming, 22 People & Blogs, 23 Comedy,
# 24 Entertainment, 25 News & Politics, 26 Howto & Style, 27 Education,
# 28 Science & Technology, 29 Nonprofits, 30 Movies, 43 Shows, 44 Trailers

