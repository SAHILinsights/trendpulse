[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendpulse"
version = "1.0.0"
description = "TrendPulse — Global YouTube Trending Intelligence & Data Engineering Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "SQLAlchemy>=2.0.30",
  "psycopg[binary]>=3.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "duckdb>=1.0",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "plotly>=5.22"]
dev = ["pytest>=8", "pytest-cov>=5", "responses>=0.25", "ruff>=0.5"]

[project.scripts]
trendpulse = "trendpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trendpulse = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: end-to-end tests that exercise the database and full pipeline (still offline)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["trendpulse"]
omit = ["src/trendpulse/dashboard/views/*", "src/trendpulse/dashboard/app.py", "src/trendpulse/dashboard/components.py"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "S608", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
